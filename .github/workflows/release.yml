name: Release

# Publishes installers people can actually download.
#
# CI builds installers on every push, but those are workflow artifacts: they
# need a GitHub login, and they expire. A tag produces a GitHub Release with the
# installers attached, which is a plain public link that keeps working.
#
#   git tag v0.1.0 && git push --tags
#
# The release is created as a draft, so the notes can be written and the
# downloads checked before anyone sees it. Publish it from the Releases page.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # One place creates the release, so three parallel builds do not race to.
  prepare:
    name: Start the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create it, empty and unpublished
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Rebuilding a tag replaces what was attached to it, rather than
          # leaving installers from an older attempt alongside the new ones.
          gh release delete "$TAG" --yes --cleanup-tag=false || true
          gh release create "$TAG" --draft --title "nankiv $TAG" \
            --notes-file .github/release-notes.md

  release:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}

      - run: npm ci

      # macOS ties a permission — Downloads, for "Import a recent download" and
      # Watch Downloads — to the app's signature. Signed ad hoc, every build has
      # a new one, so every update asks again. Signed with the same certificate
      # each time, the answer carries over. The certificate is self-signed
      # until there is a Developer ID; see docs/RELEASING.md. Without the
      # secrets this does nothing and the builds stay ad hoc.
      - name: Load the signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_SIGNING_CERTIFICATE" ]; then
            echo "::notice::No signing certificate; signing ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          # By its hash, from every identity rather than the "valid" ones: a
          # self-signed certificate is not trusted on the runner, so it is
          # never on that list.
          identity="$(security find-identity -p codesigning "$keychain" \
            | awk '/^ *1\)/ { print $2; exit }')"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Built here rather than by tauri-action, which builds a second time with
      # APPLE_SIGNING_IDENTITY set to an empty string when no signing secrets
      # exist. An empty identity overrides the ad-hoc "-" in tauri.conf.json,
      # and signing then fails — which is what sank the first four attempts at
      # this release, while the identical build in a plain step succeeded.
      #
      # Signing, when there is a certificate to sign with, comes from the step
      # above and is documented in docs/RELEASING.md.
      # With the update-signing key in the repository's secrets, each build
      # also produces a signed update bundle for Check for Updates. Without it
      # the installers build exactly as before, and the app offers the
      # releases page instead of an in-place update.
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            .github/report npm run tauri build -- ${{ matrix.args }} \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::notice::No update-signing key; building without update bundles."
            .github/report npm run tauri build -- ${{ matrix.args }}
          fi
          # A Mac build that was meant to be signed and came out ad hoc would
          # make every installed copy ask for Downloads again.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            app="$(find src-tauri/target -path '*release/bundle/macos/*.app' -prune | head -1)"
            requirement="$(codesign -d -r- "$app" 2>&1)"
            echo "$requirement"
            case "$requirement" in
              *"certificate root"* | *"certificate leaf"*) ;;
              *) echo "::error::$app is not signed with the certificate"; exit 1 ;;
            esac
          fi

      # Named for the machine they run on rather than for the version, so a
      # link on the front page keeps working after the next release. Which
      # version you have is on the release, and in the app.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installers
          while IFS= read -r file; do
            case "$file" in
              *aarch64.dmg) name=nankiv-macos-apple-silicon.dmg ;;
              *x64.dmg) name=nankiv-macos-intel.dmg ;;
              *-setup.exe) name=nankiv-windows-setup.exe ;;
              *.msi) name=nankiv-windows.msi ;;
              # Update bundles and their signatures, present only when the
              # signing key is configured. The two Macs' bundles share a
              # filename, so the architecture comes from the build directory.
              *aarch64-apple-darwin/*.app.tar.gz) name=nankiv-macos-apple-silicon.app.tar.gz ;;
              *aarch64-apple-darwin/*.app.tar.gz.sig) name=nankiv-macos-apple-silicon.app.tar.gz.sig ;;
              *x86_64-apple-darwin/*.app.tar.gz) name=nankiv-macos-intel.app.tar.gz ;;
              *x86_64-apple-darwin/*.app.tar.gz.sig) name=nankiv-macos-intel.app.tar.gz.sig ;;
              *-setup.exe.sig) name=nankiv-windows-setup.exe.sig ;;
              *) continue ;;
            esac
            cp "$file" "installers/$name"
          done < <(find src-tauri/target -path '*release/bundle/*' \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \))
          ls -lh installers
          # A job that quietly attaches nothing is worse than one that fails.
          test -n "$(ls -A installers)"

      - name: Attach them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" installers/* --clobber

  # Published only once every installer is attached: a release that is missing
  # the file for someone's machine is worse than one that is a minute late.
  publish:
    name: Publish it
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # What Check for Updates reads: the newest version, what changed, and
      # for each platform the bundle to install and its signature. Written
      # only when the builds were signed; otherwise the app finds no update
      # and offers the releases page.
      - name: Describe it for Check for Updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p signatures
          gh release download "$TAG" --pattern '*.sig' --dir signatures || true
          if [ -z "$(ls -A signatures)" ]; then
            echo "::notice::No signed update bundles; Check for Updates will offer the releases page."
            exit 0
          fi
          python3 .github/latest_json.py signatures .github/release-notes.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Make it public
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets -q '.assets[].name'
