name: CI

on:
  push:
    # This repository's default branch is master. Listing only main meant CI
    # never ran on a push — it had only ever run on pull requests.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning so lint drift can't accumulate.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: everything that doesn't need a GUI toolchain.
  # ---------------------------------------------------------------------------
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Frontend typecheck
        shell: bash
        run: .github/report npm run typecheck

      - name: Frontend lint
        shell: bash
        run: .github/report npm run lint

      - name: Frontend format
        shell: bash
        run: .github/report npm run format:check

      - name: Frontend tests
        shell: bash
        run: .github/report npm run test

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `report` prints a failing command's last lines as an annotation. A
      # workflow run's logs need a GitHub sign-in; its annotations do not, and
      # a failure nobody can read is a failure nobody can fix.
      - name: Rust lint
        shell: bash
        run: .github/report cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        # Covers unit, parser regression against all fifteen real-world
        # formats, the import -> verdict integration flow, and the matcher
        # property tests.
        shell: bash
        run: .github/report cargo test --manifest-path src-tauri/Cargo.toml

  # ---------------------------------------------------------------------------
  # The desktop widget. Needs Xcode, so it runs on its own.
  # ---------------------------------------------------------------------------
  widget-macos:
    name: macOS widget
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Widget model tests
        # Decodes the shared fixtures, which the Rust tests generate. A change
        # to the snapshot contract fails here until the Swift side follows.
        run: swift test --package-path widgets/macos/Core

      - name: Every state renders
        # Draws each state at each size into PNGs; catches a layout that throws
        # or a view that cannot be built, without needing a desktop.
        run: swift run --package-path widgets/macos/Core nankiv-widget-render "$RUNNER_TEMP/renders"

      - name: Build the widget extension
        run: widgets/macos/build.sh "$RUNNER_TEMP/widget"

      - name: The widget keeps its sandbox and nothing else
        run: |
          set -euo pipefail
          appex="$RUNNER_TEMP/widget/NankivWidget.appex"
          codesign --verify --strict "$appex"
          entitlements=$(codesign -d --entitlements - "$appex" 2>/dev/null)
          echo "$entitlements" | grep -q 'com.apple.security.app-sandbox'
          echo "$entitlements" | grep -q 'temporary-exception.files.home-relative-path.read-only'
          # A widget that could read the database, or be debugged, would be a
          # privacy problem rather than a build problem.
          ! echo "$entitlements" | grep -q 'get-task-allow'
          ! echo "$entitlements" | grep -q 'files.all'

      - uses: actions/upload-artifact@v4
        with:
          name: widget-renders
          retention-days: 14
          path: ${{ runner.temp }}/renders

  # ---------------------------------------------------------------------------
  # The Windows widget's portable half: snapshot decoding, state and wording.
  # The provider host itself needs Windows and an MSIX package; see
  # widgets/windows/README.md.
  #
  # This code has never been compiled — it was written on a machine with no
  # .NET SDK — so this job is its first real check and may fail until someone
  # fixes it on Windows. It does not block the rest of CI for that reason.
  # ---------------------------------------------------------------------------
  widget-windows-core:
    name: Windows widget content (unverified)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Provider tests
        shell: bash
        run: .github/report dotnet test widgets/windows/provider/tests --nologo

  # ---------------------------------------------------------------------------
  # Privacy guard: fixtures must never contain real student data.
  # ---------------------------------------------------------------------------
  privacy:
    name: Fixture privacy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Fixtures contain no real identifiers
        # With no real source files present this reports "nothing to compare"
        # and passes. A maintainer runs it locally against ~/Downloads before
        # regenerating fixtures; this job catches an accidentally committed
        # real spreadsheet.
        run: python3 scripts/verify_fixtures.py
      - name: No real spreadsheets committed
        run: |
          set -e
          found=$(git ls-files '*.xlsx' '*.xls' '*.ods' \
            | grep -v '^src-tauri/tests/fixtures/' || true)
          if [ -n "$found" ]; then
            echo "::error::Spreadsheets committed outside the fixtures directory:"
            echo "$found"
            exit 1
          fi
          echo "OK - only anonymised fixtures are tracked."

  # ---------------------------------------------------------------------------
  # Installable artifacts.
  # ---------------------------------------------------------------------------
  bundle:
    name: ${{ matrix.label }}
    needs: [check, privacy, widget-macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Linux is not a release target yet, but it is built on every run so
          # the codebase cannot drift away from supporting it.
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update-manifest signing. Separate from OS code signing and free.
          # Set these repository secrets to enable in-app updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Apple signing variables are deliberately absent. Passing them
          # while the secrets are unset hands the bundler an empty signing
          # identity, which overrides the ad-hoc "-" in tauri.conf.json and
          # fails the macOS build. docs/RELEASING.md covers adding them for
          # real, with a certificate behind them.
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nankiv-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
